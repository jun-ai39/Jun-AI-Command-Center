[project]
name = "phoenix-backend"
version = "0.1.0"
description = "Backend API for Phoenix OS and Jun AI Command Center"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "fastapi[standard]>=0.139.2",
    "pillow>=12.3.0",
    "pwdlib[argon2]>=0.3.1",
    "sqlalchemy>=2.0.51",
    "tzdata>=2026.3 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "httpx2>=2.7.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.black]
line-length = 88
target-version = ["py312"]
